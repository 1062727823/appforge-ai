# 开发环境：仅启动基础设施服务，前端和后端在 IDE 中运行
services:
  h2:
    build:
      context: .
      dockerfile: docker/h2.Dockerfile
    image: appforge/h2:latest
    ports:
      - "9092:9092"
      - "8082:8082"
    environment:
      H2_DATA_DIR: /opt/h2/data
    volumes:
      - h2-data:/opt/h2/data
    networks:
      - appforge-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  # 覆盖 api —— 开发时不启动
  api:
    profiles:
      - prod

  agent-runner:
    build:
      context: .
      dockerfile: docker/agent-runner.Dockerfile
    image: appforge/agent-runner:latest
    ports:
      - "8080:8080"
    environment:
      CALLBACK_URL: http://host.docker.internal:4173
      CALLBACK_TOKEN: dev-runner-token
      RUNNER_PORT: 8080
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      AGENT_POOL_MAX_CONCURRENT: ${AGENT_POOL_MAX_CONCURRENT:-3}
    volumes:
      - ./storage/appforge:/data/appforge
      - ./.env:/app/.env:ro
    networks:
      - appforge-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 5s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  code-server:
    build:
      context: .
      dockerfile: docker/code-server.Dockerfile
    image: appforge/code-server:latest
    expose:
      - "8080"
    command:
      - code-server
      - /data/appforge/workspaces
      - --bind-addr
      - 0.0.0.0:8080
      - --auth
      - none
      - --disable-telemetry
      - --disable-update-check
      - --trusted-origins=http://127.0.0.1:5173,http://127.0.0.1:4173
    environment:
      APPFORGE_API_URL: http://host.docker.internal:4173
      APPFORGE_WORKSPACE_ROOT: /data/appforge/workspaces
    volumes:
      - ./storage/appforge:/data/appforge
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - appforge-net
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    image: appforge/nginx:latest
    ports:
      - "4173:80"
    volumes:
      - ./docker/nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - appforge-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - agent-runner
      - code-server
    restart: unless-stopped

networks:
  appforge-net:
    name: appforge-net
  appforge-runtime:
    name: appforge-runtime

volumes:
  h2-data:
    name: h2-data
